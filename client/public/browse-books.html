:root{--paper:#EDEBE6;--sheet:#F4F2ED;--ink:#141414;--muted:#6D6A63;--cobalt:#1F3FB0;--rule:rgba(20,20,20,.9);--ease:cubic-bezier(.2,.8,.2,1);--H:min(46vh,31vw);--ws:0px;--d:0px;--gap:0px;color-scheme:light}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:"Inter Tight","Noto Sans JP",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
button,a{font:inherit;color:inherit}
button{appearance:none;border-radius:0}
.lbl{font-family:"Inter Tight","Noto Sans JP",system-ui,sans-serif;font-size:10.5px;font-weight:600;line-height:1;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.box{display:inline-flex;height:21px;align-items:center;justify-content:center;padding:0 8px;border:1px solid var(--rule);text-decoration:none;background:transparent}
.topbar{position:fixed;z-index:22;inset:0 0 auto;height:84px;padding:0 32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back-link{justify-self:start}
.logo{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--cobalt);text-align:center}
.logo-jp{font-family:"Noto Serif SC","Noto Sans JP",serif;font-size:22px;font-weight:700;line-height:1;letter-spacing:.04em;white-space:nowrap}
.logo-en{font-size:9px;font-weight:600;line-height:1;letter-spacing:.34em;padding-left:.34em;white-space:nowrap}
.career{justify-self:end}
.decade-nav{position:fixed;z-index:22;left:50%;top:calc(50% - var(--H)/2 - 86px);transform:translateX(-50%);display:flex;white-space:nowrap}

function decade(i){const y=films[i].year;return y<1960?'1950':String(Math.floor(y/10)*10)}
function captionSwap(el,text,dir,className){
 const span=document.createElement('span');span.className=className;span.textContent=text;el.appendChild(span);
 if(reduced.matches){for(const old of [...el.children])if(old!==span)old.remove();span.style.transform='translateY(0)';return;}
 span.animate([{transform:`translateY(${dir*105}%)`},{transform:'translateY(0)'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});
 for(const old of [...el.children]){if(old===span||old.dataset.leaving==='1')continue;const current=getComputedStyle(old).transform;old.dataset.leaving='1';const a=old.animate([{transform:current==='none'?'translateY(0)':current},{transform:`translateY(${-dir*105}%)`}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});a.onfinish=()=>old.remove();}
}
function setCaption(i,dir=1){const f=films[i];captionSwap($('#captionTitle'),f.title,dir,'caption-title');captionSwap($('#captionSub'),`${f.romaji} / ${f.kanji}`,dir,'caption-sub');captionSwap($('#captionYear'),String(f.year),dir,'caption-year');positionIndicator();}
function setActive(i,dir){if(i===active)return;active=i;setCaption(i,dir);}
function jumpToFilm(i){const base=Math.round(T);let delta=mod(i-mod(base,12)+18,12)-6;if(delta===-6)delta=6;T=base+delta;}
function updateTab(){
 $$('.decade-tab').forEach(b=>{const current=b.dataset.decade!=='all'&&b.dataset.decade===decade(active);b.classList.toggle('active',current);b.setAttribute('aria-pressed',String(current));});positionIndicator();
}
function fPosition(r){const b=Math.abs(r)<1?(r+Math.sin(Math.PI*r)/Math.PI)/2:Math.sign(r)*.5;return r*(ws+gap)+(d-ws+1.6*gap)*b;}
function cursorMode(){const cursor=$('#cursor');if(!fine.matches)return;cursor.classList.toggle('spine',hover>=0&&Math.abs(relative(hover))>.5&&!isOpen);}
function render(now){
 const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 const k=drag?18:5.2;
 if(reduced.matches){s=T;}else{s+=(T-s)*(1-Math.exp(-k*dt));if(Math.abs(T-s)<1e-4)s=T;}
 if(Math.abs(s)>144){const shift=Math.trunc(s/36)*36;s-=shift;T-=shift;}
 const next=mod(Math.round(s),12);if(next!==active){const dir=Math.sign(T-s)||Math.sign(next-active)||1;setActive(next,dir);updateTab();}
 const cyShelf=innerHeight/2;
 const near=Math.abs(mx-W/2)<.55*d&&Math.abs(my-cyShelf)<.55*H&&Math.abs(T-s)<.3&&!isOpen;
 onCover=near;
 const targetY=near?(mx-W/2)/(.55*d)*9:(mx-W/2)/W*5;
 const targetX=near?-(my-cyShelf)/(H/2)*6:0;
 const easeTilt=reduced.matches?1:1-Math.exp(-7*dt);tiltY+=(targetY-tiltY)*easeTilt;tiltX+=(targetX-tiltX)*easeTilt;
 const cursorEase=reduced.matches?1:1-Math.exp(-16*dt);cx+=(mx-cx)*cursorEase;cy+=(my-cy)*cursorEase;
 $('#cursor').style.transform=`translate3d(${cx}px,${cy}px,0)`;
 const almost=s===T,playScale=isOpen?0:smoothstep(Math.max(0,1-Math.abs(T-s)*3));$('.play-ring').style.transform=`translate(-50%,-50%) scale(${playScale})`;
 const moveEase=reduced.matches?1:1-Math.exp(-12*dt);
 const visibleEdge=W/2+1.5*d;
 for(const item of elements){
  const r=relative(item.v),x=fPosition(r);item.t.style.visibility=Math.abs(x)>visibleEdge?'hidden':'visible';
  item.liftTarget=(hover===item.v&&Math.abs(r)>.5&&!isOpen)?1:0;item.lift+=(item.liftTarget-item.lift)*moveEase;
  const o=smoothstep(Math.max(0,1-Math.abs(r))),ty=tiltY*o,tx=tiltX*o,rz=-4.5*o,z=o*.2*H,y=-o*.025*H-item.lift*.045*H;
  item.t.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateZ(${rz}deg) rotateX(${tx}deg) rotateY(${-90*o+ty*o}deg)`;
  item.t.style.zIndex=String(Math.round(100-Math.abs(r)*4));item.t.style.setProperty('--shade',String(o*.55));item.sp.style.setProperty('--shade',String(o*.55));item.cv.style.setProperty('--shade',String((1-o)*.5));item.t.setAttribute('aria-current',String(Math.abs(r)<.5));
 }
 $('#cursor').classList.toggle('open',near);if(!near)cursorMode();
 requestAnimationFrame(render);
}
function openFilmIndex(){return mod(Math.round(s),12)}
function setPoster(f){const [sid,x,y,w,h]=CROP[f.id].cover,[url,SW,SH]=SHEET[sid];posterImage.setAttribute('href',url);posterImage.setAttributeNS('http://www.w3.org/1999/xlink','href',url);posterImage.setAttribute('x',String(-x*474/w));posterImage.setAttribute('y',String(-y*900/h));posterImage.setAttribute('width',String(SW*474/w));posterImage.setAttribute('height',String(SH*900/h));}
function detailFill(f){$('#detailSub').textContent=`${f.romaji} / ${f.kanji}`;$('#detailTitle').textContent=f.title;$('#detailMeta').textContent=`${f.year} / ${f.genre.toUpperCase()} / ${f.minutes} MIN`;$('#detailSynopsis').textContent=f.synopsis;setPoster(f);}
function coverRect(){const item=elements.find(e=>e.i===openFilmIndex()&&Math.abs(relative(e.v))<.5)||elements.find(e=>Math.abs(relative(e.v))<.5);return item?item.cv.getBoundingClientRect():{left:W/2-d/2,top:innerHeight/2-H/2,width:d,height:H};}
function insetFromRect(rect){return `inset(${Math.max(0,rect.top)}px ${Math.max(0,W-rect.right)}px ${Math.max(0,innerHeight-rect.bottom)}px ${Math.max(0,rect.left)}px round 3px)`;}
async function openDetail(){
 if(isOpen)return;isOpen=true;T=Math.round(T);s=Math.round(s);active=openFilmIndex();updateTab();detailFill(films[active]);restoreFocus=document.activeElement;
 for(const b of blobs)b.setAttribute('r','0');
 detail.classList.add('visible');detail.setAttribute('aria-hidden','false');$('.play-ring').style.transform='translate(-50%,-50%) scale(0)';
 const rect=coverRect();detail.style.transformOrigin=`${rect.left+rect.width/2}px ${rect.top+rect.height/2}px`;
 const opening=detail.animate([{clipPath:insetFromRect(rect),transform:'rotate(-4.5deg)'},{clipPath:'inset(0px 0px 0px 0px round 0px)',transform:'rotate(0deg)'}],{duration:reduced.matches?1:1050,easing:'cubic-bezier(.76,0,.18,1)',fill:'both'});
 const lineEls=$$('.detail-line > *');lineEls.forEach((el,i)=>{const delay=reduced.matches?0:620+i*75;el.animate([{transform:'translateY(110%)'},{transform:'translateY(0)'}],{duration:reduced.matches?1:900,delay,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});});
 if(reduced.matches){for(const b of blobs)b.setAttribute('r','720');}else startInk();
 await opening.finished.catch(()=>{});$('#closeDetail').focus({preventScroll:true});
}
function startInk(){cancelAnimationFrame(inkFrame);const started=performance.now()+520;const delays=[0,120,220,300,360,420,180],duration=1250;
 const tick=now=>{if(!isOpen)return;let running=false;for(let i=0;i<blobs.length;i++){const p=clamp((now-started-delays[i])/duration,0,1),e=1-Math.pow(1-p,3);blobs[i].setAttribute('r',String(720*e));if(p<1)running=true;}if(running)inkFrame=requestAnimationFrame(tick);};inkFrame=requestAnimationFrame(tick);
}
async function closeDetail(){
 if(!isOpen)return;const rect=coverRect();const close=detail.animate([{clipPath:'inset(0px 0px 0px 0px round 0px)',transform:'rotate(0deg)'},{clipPath:insetFromRect(rect),transform:'rotate(-4.5deg)'}],{duration:reduced.matches?1:850,easing:'cubic-bezier(.76,0,.18,1)',fill:'both'});
 isOpen=false;cancelAnimationFrame(inkFrame);for(const el of $$('.detail-line > *'))for(const a of el.getAnimations())a.cancel();
 await close.finished.catch(()=>{});detail.classList.remove('visible');detail.setAttribute('aria-hidden','true');for(const a of detail.getAnimations())a.cancel();detail.style.transformOrigin='';T=Math.round(T);if(restoreFocus&&restoreFocus.focus)restoreFocus.focus({preventScroll:true});
}
function step(delta){if(!isOpen)T=Math.round(T)+delta;}
buildShelf();
for(const [id,[url]] of Object.entries(SHEET)){const im=new Image();im.src=url;}
layout();active=5;setCaption(active,1);updateTab();requestAnimationFrame(render);
addEventListener('resize',layout,{passive:true});
$('.prev').addEventListener('click',()=>step(-1));$('.next').addEventListener('click',()=>step(1));$('.play-ring').addEventListener('click',openDetail);$('#closeDetail').addEventListener('click',closeDetail);
$$('.decade-tab').forEach(btn=>btn.addEventListener('click',()=>{const val=btn.dataset.decade;if(val==='all')jumpToFilm(0);else{const first=films.findIndex(f=>String(Math.floor(f.year/10)*10)===val);if(first>=0)jumpToFilm(first);}}));
$$('a[href="#"]').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
$('#watchButton').addEventListener('click',()=>{const note=$('#watchNote');note.classList.add('show');clearTimeout(watchTimer);watchTimer=setTimeout(()=>note.classList.remove('show'),2600);});
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(fine.matches){const target=e.target;$('#cursor').classList.toggle('btn',!!target.closest('button,a')&&!target.closest('.tape')&&!onCover);}} ,{passive:true});
shelf.addEventListener('pointerdown',e=>{if(isOpen||e.button!==0)return;drag={x:e.clientX,start:T,moved:false,captured:false,id:e.pointerId};},{passive:true});
addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>5)drag.moved=true;if(drag.moved){if(!drag.captured){try{shelf.setPointerCapture(e.pointerId);drag.captured=true}catch{}}T=drag.start-dx/(ws+gap);dragSuppress=true;}},{passive:true});
function finishDrag(e){if(!drag||drag.id!==e.pointerId)return;if(drag.moved)T=Math.round(T);drag=null;setTimeout(()=>dragSuppress=false,80);}
addEventListener('pointerup',finishDrag,{passive:true});addEventListener('pointercancel',finishDrag,{passive:true});
addEventListener('wheel',e=>{if(isOpen)return;e.preventDefault();const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;T+=delta/(ws+gap)*.5;clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>T=Math.round(T),160);},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(isOpen)closeDetail();return;}if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}if(e.key==='ArrowRight'){e.preventDefault();step(1);}if(e.key==='Enter'&&!isOpen&&(document.activeElement===document.body||document.activeElement===shelf)){e.preventDefault();openDetail();}});
})();
</script>
</body>
